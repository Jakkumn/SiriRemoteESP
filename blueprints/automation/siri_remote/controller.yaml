blueprint:
  name: Siri Remote (3rd gen) controller
  description: |
    Wire up every button on an Apple Siri Remote (3rd gen) routed through the
    SiriRemoteESP bridge, in a single automation.

    All bindings are optional — leave any slot blank to skip it.

    **How the bridge reports input.** It behaves like an IR remote. Pressing a
    button fires `esphome.siri_remote_button` with `repeat: 0`; while you keep
    holding it, the same event repeats every `repeat_interval_ms` (100 ms by
    default) with `repeat` counting up and `held_ms` measuring how long it has
    been down. **There is no release event** — the pulses simply stop, exactly
    like an IR receiver seeing repeat frames end.

    So each button gets two slots:

    - *press* — runs once, the instant the button goes down.
    - *while held* — runs repeatedly, about ten times a second, once the
      typematic delay has elapsed. Put an incremental action here (one volume
      step, one scroll tick). It is not a "hold started" event and there is no
      matching "hold ended" one.

    Both slots fire for a long press: the press slot once at the start, then
    the held slot for as long as you keep holding. If you want them to be
    mutually exclusive, see the tap-vs-hold recipe in the project README.

    For a single button with finer control (rate division, extra conditions),
    use the companion "single button" blueprint instead.

    Install: drop this file into <HA config>/blueprints/automation/
    siri_remote/controller.yaml, then Settings → Automations → Blueprints.

  domain: automation
  source_url: https://github.com/Jakkumn/SiriRemoteESP/blob/main/blueprints/automation/siri_remote/controller.yaml

  input:
    bridge_device:
      name: Bridge
      description: >-
        The Siri Remote bridge this automation listens to. Required, so that
        two bridges in one house don't trigger each other's automations.
      selector:
        device:
          integration: esphome

    typematic_delay_ms:
      name: Typematic delay (ms)
      description: >-
        How long a button must be down before its "while held" slot starts
        running — the same idea as a keyboard's delay-before-repeat. Press
        slots always fire immediately regardless of this value.
      default: 400
      selector:
        number: { min: 0, max: 5000, step: 50, unit_of_measurement: ms, mode: box }

    # --- Clickpad (centre + 4 directions) ------------------------------
    select_press:
      name: "Select (clickpad centre) — press"
      default: []
      selector: { action: {} }
    select_held:
      name: "Select (clickpad centre) — while held"
      default: []
      selector: { action: {} }
    up_press:
      name: "Up (clickpad) — press"
      default: []
      selector: { action: {} }
    up_held:
      name: "Up (clickpad) — while held"
      default: []
      selector: { action: {} }
    right_press:
      name: "Right (clickpad) — press"
      default: []
      selector: { action: {} }
    right_held:
      name: "Right (clickpad) — while held"
      default: []
      selector: { action: {} }
    down_press:
      name: "Down (clickpad) — press"
      default: []
      selector: { action: {} }
    down_held:
      name: "Down (clickpad) — while held"
      default: []
      selector: { action: {} }
    left_press:
      name: "Left (clickpad) — press"
      default: []
      selector: { action: {} }
    left_held:
      name: "Left (clickpad) — while held"
      default: []
      selector: { action: {} }

    # --- Media / volume cluster ----------------------------------------
    play_pause_press:
      name: "Play / Pause — press"
      default: []
      selector: { action: {} }
    play_pause_held:
      name: "Play / Pause — while held"
      default: []
      selector: { action: {} }
    volume_up_press:
      name: "Volume Up — press"
      default: []
      selector: { action: {} }
    volume_up_held:
      name: "Volume Up — while held"
      default: []
      selector: { action: {} }
    volume_down_press:
      name: "Volume Down — press"
      default: []
      selector: { action: {} }
    volume_down_held:
      name: "Volume Down — while held"
      default: []
      selector: { action: {} }
    mute_press:
      name: "Mute — press"
      default: []
      selector: { action: {} }
    mute_held:
      name: "Mute — while held"
      default: []
      selector: { action: {} }

    # --- System --------------------------------------------------------
    back_press:
      name: "Back — press"
      default: []
      selector: { action: {} }
    back_held:
      name: "Back — while held"
      default: []
      selector: { action: {} }
    tv_press:
      name: "TV — press"
      default: []
      selector: { action: {} }
    tv_held:
      name: "TV — while held"
      default: []
      selector: { action: {} }
    power_press:
      name: "Power — press"
      default: []
      selector: { action: {} }
    power_held:
      name: "Power — while held"
      default: []
      selector: { action: {} }
    mic_press:
      name: "Mic (Siri) — press"
      default: []
      selector: { action: {} }
    mic_held:
      name: "Mic (Siri) — while held"
      default: []
      selector: { action: {} }

# Pulses arrive ~10/sec while a button is held. `single` would silently drop
# every pulse that lands while a previous run is still going, which at this
# rate is most of them. Parallel runs don't block each other and the actions
# are idempotent increments, so ordering doesn't matter. max is generous
# enough that a few seconds of holding can't exhaust it.
mode: parallel
max: 25
max_exceeded: silent

triggers:
  - trigger: event
    event_type: esphome.siri_remote_button

variables:
  bridge_device: !input bridge_device
  typematic_delay_ms: !input typematic_delay_ms
conditions:
  # HA's ESPHome integration injects device_id into every event it fires, so we
  # match on that rather than the payload's human-readable `device` name. It is
  # exact, it is literally what the device selector above returns, and it
  # survives the user renaming the device in the UI — a name comparison would
  # silently stop matching and give no error anywhere.
  - condition: template
    value_template: "{{ trigger.event.data.device_id == bridge_device }}"

actions:
  - choose:
      # Select (clickpad centre)
      - conditions: >-
          {{ trigger.event.data.button == 'select'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input select_press
      - conditions: >-
          {{ trigger.event.data.button == 'select'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input select_held
      # Up (clickpad)
      - conditions: >-
          {{ trigger.event.data.button == 'up'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input up_press
      - conditions: >-
          {{ trigger.event.data.button == 'up'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input up_held
      # Right (clickpad)
      - conditions: >-
          {{ trigger.event.data.button == 'right'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input right_press
      - conditions: >-
          {{ trigger.event.data.button == 'right'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input right_held
      # Down (clickpad)
      - conditions: >-
          {{ trigger.event.data.button == 'down'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input down_press
      - conditions: >-
          {{ trigger.event.data.button == 'down'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input down_held
      # Left (clickpad)
      - conditions: >-
          {{ trigger.event.data.button == 'left'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input left_press
      - conditions: >-
          {{ trigger.event.data.button == 'left'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input left_held
      # Play / Pause
      - conditions: >-
          {{ trigger.event.data.button == 'play_pause'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input play_pause_press
      - conditions: >-
          {{ trigger.event.data.button == 'play_pause'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input play_pause_held
      # Volume Up
      - conditions: >-
          {{ trigger.event.data.button == 'volume_up'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input volume_up_press
      - conditions: >-
          {{ trigger.event.data.button == 'volume_up'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input volume_up_held
      # Volume Down
      - conditions: >-
          {{ trigger.event.data.button == 'volume_down'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input volume_down_press
      - conditions: >-
          {{ trigger.event.data.button == 'volume_down'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input volume_down_held
      # Mute
      - conditions: >-
          {{ trigger.event.data.button == 'mute'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input mute_press
      - conditions: >-
          {{ trigger.event.data.button == 'mute'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input mute_held
      # Back
      - conditions: >-
          {{ trigger.event.data.button == 'back'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input back_press
      - conditions: >-
          {{ trigger.event.data.button == 'back'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input back_held
      # TV
      - conditions: >-
          {{ trigger.event.data.button == 'tv'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input tv_press
      - conditions: >-
          {{ trigger.event.data.button == 'tv'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input tv_held
      # Power
      - conditions: >-
          {{ trigger.event.data.button == 'power'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input power_press
      - conditions: >-
          {{ trigger.event.data.button == 'power'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input power_held
      # Mic (Siri)
      - conditions: >-
          {{ trigger.event.data.button == 'mic'
             and trigger.event.data.repeat | int == 0 }}
        sequence: !input mic_press
      - conditions: >-
          {{ trigger.event.data.button == 'mic'
             and trigger.event.data.repeat | int > 0
             and trigger.event.data.held_ms | int
                 >= (typematic_delay_ms | int) }}
        sequence: !input mic_held
