# Working ESPHome config for the Siri Remote bridge.
#
#   cp secrets.yaml.example secrets.yaml   # then edit and fill in real values
#   uv run esphome run example.yaml
#
# secrets.yaml must define: wifi_ssid, wifi_password, api_key, ota_password.
# See secrets.yaml.example for how to generate api_key.
#
# First-time pairing: hold Back + Vol Up on the remote for ~5 s once the
# bridge logs "siri_remote setup complete". See README.md for the full
# pairing flow and re-pair instructions.

esphome:
  name: siri-bridge

esp32:
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: esphome/components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

siri_remote:
  # Hand the firmware a pointer to voice_assistant. Two behaviors come
  # along with this:
  #  1. Mic press fires voice_assistant.start directly from the BLE
  #     callback (saves ~5–15 ms vs the binary_sensor → on_press hop).
  #  2. With auto_finish_response: true (default), the hub sends
  #     VoiceAssistantAnnounceFinished on TTS_END so HA's
  #     assist_satellite UI cleanly returns to Idle even though the
  #     bridge has no speaker. Set to false if you wire a real speaker
  #     or media_player on voice_assistant: (those paths already send
  #     AnnounceFinished and you'd get duplicates otherwise).
  voice_assistant_id: siri_voice_assistant
  # auto_finish_response: true   # default

binary_sensor:
  - platform: siri_remote
    type: voice_active
    name: "Siri Remote Voice Active"
    device_class: running
    # No on_press: voice_assistant.start here — voice_assistant_id above
    # already fires it from the firmware. Adding it back would double-fire.
    # Mic-release is also intentionally NOT wired to voice_assistant.stop;
    # voice_assistant's VAD finalizes STT on detected silence. Aborting via
    # release drops in-flight utterances when the user releases before VAD
    # completes (5.B silence injection feeds zeros so VAD can detect end).

microphone:
  - platform: siri_remote
    id: siri_remote_mic

voice_assistant:
  id: siri_voice_assistant
  microphone:
    microphone: siri_remote_mic
  use_wake_word: false
  # No speaker:/media_player: configured — bridge has no audio-out. The
  # auto_finish_response knob on siri_remote: handles the assist_satellite
  # state transition that voice_assistant would normally do via playback
  # timeout. See README "TTS playback options" for routing TTS to a
  # different HA media_player (Sonos, Echo) or wiring a real speaker.

sensor:
  - platform: siri_remote
    type: battery
    name: "Siri Remote Battery"

text_sensor:
  - platform: siri_remote
    type: charging
    name: "Siri Remote Charging"

switch:
  - platform: siri_remote
    type: raw_stream
    name: "Siri Remote Raw Touch Stream"

# Pressing this wipes the BLE bond — the user must hold Back+VolUp on the
# remote within ~5 minutes to re-pair.
button:
  - platform: siri_remote
    type: repair
    name: "Siri Remote Re-pair"

# Runtime-tunable thresholds. All NVS-persisted via ESPHome Preferences.
# Defaults match the standalone Kconfig defaults; override min/max/step in
# YAML if you want a different slider range.
number:
  - platform: siri_remote
    type: swipe_y_priority
    name: "Siri Remote Swipe Y Priority"
  - platform: siri_remote
    type: swipe_min_distance
    name: "Siri Remote Swipe Min Distance"
  - platform: siri_remote
    type: double_click_window_ms
    name: "Siri Remote Double-Click Window"
    unit_of_measurement: "ms"
  - platform: siri_remote
    type: hold_threshold_ms
    name: "Siri Remote Hold Threshold"
    unit_of_measurement: "ms"
  - platform: siri_remote
    type: battery_low_pct
    name: "Siri Remote Battery Low Threshold"
    unit_of_measurement: "%"
  - platform: siri_remote
    type: ble_slave_latency
    name: "Siri Remote BLE Slave Latency"

# -----------------------------------------------------------------------------
# Home Assistant automation example (paste into HA's automations.yaml).
# Discrete remote events fire as `esphome.siri_remote_event` with payload
# {action, button, duration_ms, distance}. See README.md for the full field
# table + more examples (hold-to-dim, magnitude-aware swipes, voice_active).
#
# automation:
#   - alias: "Volume Up click toggles living-room light"
#     trigger:
#       platform: event
#       event_type: esphome.siri_remote_event
#       event_data:
#         action: click
#         button: volume_up
#     action:
#       service: light.toggle
#       target:
#         entity_id: light.living_room
# -----------------------------------------------------------------------------
