# Working ESPHome config for the Siri Remote bridge.
#
#   esphome run example.yaml
#
# First-time pairing: hold Back + Vol Up on the remote for ~5 s once the
# bridge logs "siri_remote setup complete" — same dance as the standalone
# build.

esphome:
  name: siri-bridge

esp32:
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: esphome/components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# Defaults are fine — voice on, always-connected, no debug knobs.
siri_remote:

binary_sensor:
  - platform: siri_remote
    type: voice_active
    name: "Siri Remote Voice Active"
    device_class: running

sensor:
  - platform: siri_remote
    type: battery
    name: "Siri Remote Battery"

text_sensor:
  - platform: siri_remote
    type: charging
    name: "Siri Remote Charging"

switch:
  - platform: siri_remote
    type: raw_stream
    name: "Siri Remote Raw Touch Stream"

# Pressing this wipes the BLE bond — the user must hold Back+VolUp on the
# remote within ~5 minutes to re-pair.
button:
  - platform: siri_remote
    type: repair
    name: "Siri Remote Re-pair"
